##########################
# Controller settings    #
##########################
# The horizon is a DISTANCE, not a duration: the model integrates over the path
# coordinate s. N nodes over s_horizon metres gives a node spacing of s_horizon/N.
N: 40
s_horizon: !!float 12.0   # [m] ~1.5 s at 8 m/s
MPC_freq: 20              # [Hz] rate at which the controller is called
t_delay: !!float 0.05     # [s] actuation delay, mapped to a horizon node with the predicted clock

track_safety_margin: 0.35
track_max_width: !!float 1e3 # [m]
overtake_d: !!float 1
# Bounds on ds/dt. The spatial dynamics divide by it, so the lower bound must be > 0.
# The upper bound is what keeps the objective bounded: ds/dt has (1 - kappa*n) in its
# denominator, so without it the cheapest trajectory is one that leaves the track
# towards the centre of curvature. Both are HARD constraints.
s_dot_min: !!float 0.3
s_dot_max: !!float 20.0   # ~2 * v_max, above anything the car can reach

##########################
# Cost function settings #
##########################
# The time term is exactly qtime * (horizon traversal time in seconds), so every weight
# below is "how many qtime-seconds is this worth". Only the ratios matter to the
# optimum; qtime is 100 rather than 1 so that all the terms come out order 1, which
# conditions the QP better.
# Rough scale at 6 m/s over a 12 m horizon: the time term is ~200, and one extra m/s
# across the horizon is worth ~33.
qtime: !!float 100.0
qv: !!float 10            # velocity tracking, ONLY active while TRAILING
qn: !!float 1.0           # lateral deviation. Low on purpose: the time-optimal line is
                          # not the centre line, and a high qn just tracks the raceline
                          # again, which is what this controller exists to stop doing
qalpha: !!float 0.1       # heading deviation
qvy: !!float 2.0          # lateral velocity, the drift penalty
qjerk: !!float 5.0e-3
qddelta: !!float 0.5
# Bonus on the exit speed at the last node, standing in for the time still to be spent
# beyond the horizon. 0 is the pure finite-horizon minimum-time problem.
qv_terminal: !!float 0.0
terminal_multiplier: !!float 1.5

Zl: !!float 1000 # quadratic coefficient state slack variable
Zu: !!float 1000 # quadratic coefficient input slack variable
zl: !!float 1000 # linear coefficient state slack variable
zu: !!float 1000 # linear coefficient input slack variable

#####################
# Model constraints #
#####################
# state bounds
delta_min: !!float -0.4 # minimum steering angle [rad]
delta_max: !!float 0.4  # maximum steering angle [rad]
# v_min must be > 0: the spatial model is singular at standstill. It also bounds how
# much *time* one 0.3 m node can span, which is what the integrator step depends on.
v_min: !!float 1.0      # minimum velocity [m/s]
# With no reference speed to track, v_max and the acceleration limits are what set the
# pace. Time-optimal means the solution sits on whichever of them binds -- so unlike in
# the tracking controllers these have to be the car's REAL limits, not loose ones.
# STMPC ships a_min/a_max at -15/15 and alat_max at 15 with the note that the numbers
# are deliberately too high; a controller that tracks a speed profile never asks for
# its limit, so a loose one is harmless there. This one asks for it every cycle. With
# STMPC's numbers it commands 15 m/s^2 of lateral on a tire that can deliver 8, the
# rear steps out, and the car spins on the first tight corner.
v_max: !!float 10       # maximum velocity [m/s], raceline peaks at 6.53
a_min: !!float -3.0     # maximum braking [m/s^2], car_model.yaml a_min
a_max: !!float 3.0      # maximum acceleration [m/s^2], car_model.yaml a_max

# input bounds
ddelta_min: !!float -3.2 # [rad/s]
ddelta_max: !!float 3.2  # [rad/s]
jerk_min: !!float -50
jerk_max: !!float 50

# nonlinear constraint
# The tire's real capability: Pacejka Dr = 1.057 at mu = 1, and the global raceline's
# own peak v^2*kappa on this track is 7.98 m/s^2.
alat_max: !!float 8.0 # maximum lateral acceleration [m/s^2]

#####################
# constraints flags #
#####################
combined_constraints: "ellipse" # ellipse/diamond/anything else for None

# model flags #
load_transfer: true
